name: prerelease

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: prerelease-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.ref.outputs.default_branch }}
    steps:
      - name: Require the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" ]]; then
            echo "Release dispatch rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            smoke: command
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            bun_target: bun-linux-x64-musl
            smoke: version
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bun_target: bun-linux-arm64-musl
            smoke: version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Require Bun 1.4.4
        run: |
          version=$(bun --version)
          if [[ "$version" != 1.4.4 ]]; then
            echo "Expected Bun 1.4.4, got $version" >&2
            exit 1
          fi
      - name: Install dependencies
        run: bun install --production --ignore-scripts --no-save
      - name: Compile srt
        run: bun run build:srt -- --target="${{ matrix.bun_target }}" --outfile="srt-${{ matrix.target }}"
      - name: Smoke the binary
        run: |
          asset="srt-${{ matrix.target }}"
          version=$(bun -e 'process.stdout.write(require("./package.json").version)')
          home=$(mktemp -d)
          got=$(HOME="$home" "./$asset" --version)
          if [[ "$got" != "$version" ]]; then
            echo "Expected version $version, got $got" >&2
            exit 1
          fi
          if [[ "${{ matrix.smoke }}" == command ]]; then
            got=$(HOME="$home" "./$asset" echo srt-ok)
            if [[ "$got" != srt-ok ]]; then
              echo "Expected sandboxed echo, got $got" >&2
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srt-${{ matrix.target }}
          path: srt-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Create pre-release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recheck release ref and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          else
            if [[ "$response" != *"HTTP 404"* ]]; then
              printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
              exit 1
            fi
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: srt-*
          path: dist
      - name: Validate and package release artifacts
        run: |
          set -euo pipefail
          expected_artifacts=$'srt-aarch64-apple-darwin\nsrt-aarch64-unknown-linux-musl\nsrt-x86_64-unknown-linux-musl'
          actual_artifacts=$(find dist -mindepth 1 -maxdepth 1 -print | sed 's|.*/||' | LC_ALL=C sort)
          if [[ "$actual_artifacts" != "$expected_artifacts" ]]; then
            echo "Unexpected release artifact directories:" >&2
            printf '%s\n' "$actual_artifacts" >&2
            exit 1
          fi
          mkdir dist/zips
          for artifact in srt-aarch64-apple-darwin srt-aarch64-unknown-linux-musl srt-x86_64-unknown-linux-musl; do
            actual=$(find "dist/$artifact" -type f -print | sed 's|.*/||' | LC_ALL=C sort)
            if [[ "$actual" != "$artifact" ]]; then
              echo "Unexpected files in artifact $artifact:" >&2
              printf '%s\n' "$actual" >&2
              exit 1
            fi
            zip -9 --junk-paths "dist/zips/${artifact}.zip" "dist/$artifact/$artifact"
          done
          cd dist/zips
          sha256sum ./*.zip | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create release tag at triggering SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: release-${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1); then
            echo "Release publication rejected: tag $RELEASE_TAG already exists; inspect it before proceeding" >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            printf 'Could not verify that tag %s is absent: %s\n' "$RELEASE_TAG" "$response" >&2
            exit 1
          fi
          if response=$(gh api "repos/$REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" 2>&1); then
            echo "Created $RELEASE_TAG at $GITHUB_SHA"
          else
            printf 'Could not create release tag %s at %s: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" "$response" >&2
            exit 1
          fi
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/zips/*.zip dist/zips/SHA256SUMS --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag --title "$RELEASE_TAG"
